apiVersion: apps/v1
kind: Deployment
metadata:
  name: women-safety-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: women-safety-backend
  template:
    metadata:
      labels:
        app: women-safety-backend
    spec:
      containers:
        - name: backend
          image: women-safety-backend:1.0.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: women-safety-backend
spec:
  selector:
    app: women-safety-backend
  ports:
    - port: 8080
      targetPort: 8080
