spring.application.name=women-safety-backend
server.port=8080

# PostgreSQL - enable when you want persistent relational storage.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/womensafety}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# MongoDB - enable when MongoDB is available.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/womensafety}

# Prototype mode keeps the core demo usable even when databases are not running.
app.prototype-mode=${PROTOTYPE_MODE:true}
